[package]
name = "protocol_mcp_gateway"
version = "0.14.2"
edition = "2024"
license = "Apache-2.0"

[dependencies]
axum = "0.7"
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value", "preserve_order", "float_roundtrip"] }
sha2 = "0.10.9"
hex = "0.4.3"
genesis_kernel = { path = "../genesis_kernel" }
genesis_solvers = { path = "../genesis_solvers" }
genesis_seal = { path = "../genesis_seal" }
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io"] }
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "service"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.36", features = ["full"] }
axum = "0.7"
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10.9"
hex = "0.4.3"
genesis_kernel = { path = "../genesis_kernel" }
genesis_solvers = { path = "../genesis_solvers" }
rmcp = { version = "3.5.1", default-features = false, features = ["client", "transport-child-process", "server", "transport-io", "transport-streamable-http-client-reqwest"] }
# The tests play the instrument: they sign readings with the bench's test keys.
# The engine itself only verifies, through genesis_seal.
ed25519-dalek = { version = "2.2", default-features = false }
