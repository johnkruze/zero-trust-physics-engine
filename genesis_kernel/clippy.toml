# Served code calls no method of the platform's math library: each answer
# must be the same 64 bits on every IEEE 754 machine, and the platform's
# libraries round these functions differently (Apple's libm, glibc on arm64,
# glibc on x86_64 with and without FMA). genesis_kernel::math carries the
# functions the engine uses. sqrt and mul_add stay: IEEE 754 fixes both to the
# last bit. The check, from the workspace:
#   cargo clippy --release -p genesis_kernel -p genesis_solvers -p protocol_mcp_gateway --lib --bins -- -A clippy::all -D clippy::disallowed_methods
disallowed-methods = [
    { path = "f64::exp", reason = "the platform's math library rounds it its own way: call genesis_kernel::math::exp" },
    { path = "f64::exp2", reason = "the platform's math library rounds it its own way: call no function of genesis_kernel::math: add one, ported as math.rs ports" },
    { path = "f64::exp_m1", reason = "the platform's math library rounds it its own way: call genesis_kernel::math::exp_m1" },
    { path = "f64::ln", reason = "the platform's math library rounds it its own way: call genesis_kernel::math::log" },
    { path = "f64::log", reason = "the platform's math library rounds it its own way: call no function of genesis_kernel::math: add one, ported as math.rs ports" },
    { path = "f64::log2", reason = "the platform's math library rounds it its own way: call no function of genesis_kernel::math: add one, ported as math.rs ports" },
    { path = "f64::log10", reason = "the platform's math library rounds it its own way: call genesis_kernel::math::log10" },
    { path = "f64::ln_1p", reason = "the platform's math library rounds it its own way: call genesis_kernel::math::ln_1p" },
    { path = "f64::powf", reason = "the platform's math library rounds it its own way: call genesis_kernel::math::powf" },
    { path = "f64::powi", reason = "the platform's math library rounds it its own way: call genesis_kernel::math::powi" },
    { path = "f64::sin", reason = "the platform's math library rounds it its own way: call genesis_kernel::math::sin" },
    { path = "f64::cos", reason = "the platform's math library rounds it its own way: call genesis_kernel::math::cos" },
    { path = "f64::tan", reason = "the platform's math library rounds it its own way: call genesis_kernel::math::tan" },
    { path = "f64::sin_cos", reason = "the platform's math library rounds it its own way: call no function of genesis_kernel::math: add one, ported as math.rs ports" },
    { path = "f64::asin", reason = "the platform's math library rounds it its own way: call genesis_kernel::math::asin" },
    { path = "f64::acos", reason = "the platform's math library rounds it its own way: call genesis_kernel::math::acos" },
    { path = "f64::atan", reason = "the platform's math library rounds it its own way: call genesis_kernel::math::atan" },
    { path = "f64::atan2", reason = "the platform's math library rounds it its own way: call genesis_kernel::math::atan2" },
    { path = "f64::sinh", reason = "the platform's math library rounds it its own way: call genesis_kernel::math::sinh" },
    { path = "f64::cosh", reason = "the platform's math library rounds it its own way: call genesis_kernel::math::cosh" },
    { path = "f64::tanh", reason = "the platform's math library rounds it its own way: call genesis_kernel::math::tanh" },
    { path = "f64::asinh", reason = "the platform's math library rounds it its own way: call genesis_kernel::math::asinh" },
    { path = "f64::acosh", reason = "the platform's math library rounds it its own way: call no function of genesis_kernel::math: add one, ported as math.rs ports" },
    { path = "f64::atanh", reason = "the platform's math library rounds it its own way: call no function of genesis_kernel::math: add one, ported as math.rs ports" },
    { path = "f64::cbrt", reason = "the platform's math library rounds it its own way: call genesis_kernel::math::cbrt" },
