[package]
name = "genesis_seal"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[lib]
name = "genesis_seal"
path = "src/lib.rs"

[[bin]]
name = "genesis_seal"
path = "src/bin/genesis_seal.rs"

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10.9"
hex = "0.4.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
